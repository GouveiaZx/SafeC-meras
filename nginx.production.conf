# =========================================================
# NGINX CONFIGURATION - SISTEMA NEWCAM PRODUÇÃO
# =========================================================
# Servidor: 186.233.4.8 (Janeiro 2025)
#
# Instalação:
# sudo cp nginx.production.conf /etc/nginx/sites-available/newcam
# sudo ln -sf /etc/nginx/sites-available/newcam /etc/nginx/sites-enabled/
# sudo rm -f /etc/nginx/sites-enabled/default
# sudo nginx -t && sudo systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Upstream backends
upstream newcam_backend {
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Main HTTPS server block
server {
    server_name nuvem.safecameras.com.br;

    # =====================================
    # SECURITY HEADERS (HTTPS)
    # =====================================
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self';" always;
    
    # =====================================
    # FRONTEND - ARQUIVOS ESTÁTICOS
    # =====================================
    location / {
        root /var/www/newcam;
        try_files $uri $uri/ /index.html;
        
        # Cache para arquivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
        
        # Desabilitar cache para index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # =====================================
    # API BACKEND
    # =====================================
    location /api {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://newcam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # =====================================
    # AUTHENTICATION - EXTRA PROTECTION
    # =====================================
    location /api/auth {
        limit_req zone=auth burst=5 nodelay;
        
        proxy_pass http://newcam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extra security for auth endpoints
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # =====================================
    # WEBSOCKET - REAL-TIME COMMUNICATION
    # =====================================
    location /ws {
        proxy_pass http://newcam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_read_timeout 86400; # 24 hours
        proxy_send_timeout 86400;
    }

    # =====================================
    # SOCKET.IO - REAL-TIME UPDATES
    # =====================================
    location /socket.io/ {
        proxy_pass http://newcam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Socket.IO specific timeouts
        proxy_read_timeout 86400; # 24 hours
        proxy_send_timeout 86400;
        proxy_connect_timeout 75s;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # =====================================
    # STREAMING - ZLMEDIAKIT
    # =====================================
    location /live {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers para streaming
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
        
        # Timeouts para streaming
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Disable buffering for live streams
        proxy_buffering off;
    }

    # =====================================
    # ZLMEDIAKIT API
    # =====================================
    location /index/api {
        # Internal API - restrict access
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # HEALTH CHECK
    # =====================================
    location /health {
        proxy_pass http://newcam_backend;
        access_log off;
    }

    # =====================================
    # SECURITY - BLOCK COMMON ATTACKS
    # =====================================
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Block access to backup files
    location ~ ~$ {
        deny all;
    }
    
    # Block access to common sensitive files
    location ~* \.(env|log|sql|tar|gz|zip|bak)$ {
        deny all;
    }

    # =====================================
    # COMPRESSION
    # =====================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # =====================================
    # LOGGING
    # =====================================
    access_log /var/log/nginx/newcam_access.log combined;
    error_log /var/log/nginx/newcam_error.log warn;

    # SSL Configuration (managed by Certbot)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nuvem.safecameras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuvem.safecameras.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name nuvem.safecameras.com.br;

    if ($host = nuvem.safecameras.com.br) {
        return 301 https://$host$request_uri;
    }

    return 404;
}